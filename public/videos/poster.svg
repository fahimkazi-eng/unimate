      <stop offset="0%" stop-color="#1b1b2f"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <circle cx="640" cy="300" r="280" fill="#8b5cf6" opacity="0.16"/>
  <circle cx="400" cy="440" r="200" fill="#a855f7" opacity="0.12"/>
  <circle cx="920" cy="180" r="180" fill="#4f46e5" opacity="0.14"/>

  <!-- Mortarboard -->
  <polygon points="640,150 900,205 640,285 380,205" fill="url(#brand)"/>
  <polygon points="380,205 640,285 640,330 445,258" fill="#6d28d9"/>
  <polygon points="900,205 640,285 640,330 835,258" fill="#7c3aed"/>
  <line x1="640" y1="285" x2="760" y2="250" stroke="#e9d5ff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="768" cy="247" r="9" fill="#e9d5ff"/>

  <!-- Wordmark -->
  <text x="640" y="440" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="58" font-weight="700" letter-spacing="10" fill="#ededf5">UNIMATE</text>
  <text x="640" y="488" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="600" letter-spacing="8" fill="#a78bfa">PRODUCT TOUR</text>
  <text x="640" y="530" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#8b8b9e">Creator walkthrough — being recorded</text>

  <rect x="560" y="620" width="160" height="36" rx="18" fill="#8b5cf6" opacity="0.18"/>
  <text x="640" y="643" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" letter-spacing="3" fill="#c4b5fd">CREATOR VIDEO</text>
